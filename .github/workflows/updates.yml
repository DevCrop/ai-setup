name: updates

# Weekly update PR (decision 2026-10-13, docs/DECISIONS.md "Pinned versions move by a weekly PR"): moves the pins in
# claude/settings.json and codex/versions.lock.json to the newest upstream releases and records the newest release of the
# unpinned tools in docs/tool-versions.json. Nothing is installed anywhere; changes land only when the PR is reviewed and merged.
on:
  schedule:
    - cron: "47 0 * * 1"  # Mondays 00:47 UTC (09:47 KST)
  workflow_dispatch:

permissions:
  contents: write       # push the bot/updates branch
  pull-requests: write  # open or update the PR
  actions: write        # dispatch check.yml on bot/updates

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check upstream releases and move the pins
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/check-updates.py --write > "$RUNNER_TEMP/report.md" || rc=$?
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0|2) echo "rc=$rc" >> "$GITHUB_OUTPUT" ;;  # 2 = a source failed: reported, the others were still written
            *) exit "$rc" ;;
          esac
      - name: Open or update the PR on bot/updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A claude/settings.json codex/versions.lock.json codex/vendor docs/tool-versions.json
          if git diff --cached --quiet; then echo "No pin or recorded version changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/updates
          git commit -q -m "chore: update pinned versions"
          # Only this workflow writes bot/updates, so replacing it each week loses nothing.
          git push --force origin bot/updates
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Opened by \`.github/workflows/updates.yml\` (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Nothing was installed on any PC. Review, wait for \`check\`, then merge."
          } > "$RUNNER_TEMP/body.md"
          pr="$(gh pr list --head bot/updates --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head bot/updates --title "chore: update pinned versions" --body-file "$RUNNER_TEMP/body.md"
          fi
          # A push or PR made with GITHUB_TOKEN starts no other workflow; workflow_dispatch is the exception, so run check.yml here.
          gh workflow run check.yml --ref bot/updates
      - name: Fail the run when a source failed
        if: steps.check.outputs.rc == '2'
        run: |
          echo "::error::At least one upstream source failed; see the report above (the PR, if any, has the same list)."
          exit 1
