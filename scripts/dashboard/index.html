<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Global Workflow</title>
<style>
/* Direction: Claude Code's terminal look. One monospace face for everything (the font a terminal gives Claude Code),
   warm near-black canvas, Claude orange as the single accent, dim gray secondary text, hairline borders, no shadows.
   State is carried by badges (OK / WARN / FAIL / info), never by color alone. Charts update with transitions.
   Layout: one-screen app shell on desktop (KPI strip, pipeline, three panels); below 1100px it stacks and scrolls. */
:root {
  --bg: #faf9f5; --panel: #ffffff; --line: #e8e6dc; --fg: #141413; --muted: #5e5d59; --faint: #8a887f;
  --accent: #d77757; --accent-soft: #f6e6de; --accent-ink: #b9532f;
  --ok: #3f7a3a; --ok-soft: #e4efdf; --warn: #9a6200; --warn-soft: #f7ecd2; --bad: #b53333; --bad-soft: #f6e0dc; --info: #3c6fa8; --info-soft: #e1ebf6;
  --sans: Poppins, "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
  --serif: Lora, "Noto Serif KR", "Batang", Georgia, serif;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "D2Coding", "Malgun Gothic", Menlo, monospace;
  --s2: 8px; --s3: 12px; --s4: 16px;
  --r-sm: 4px; --r-lg: 8px;
  --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 15px; --t-kpi: 26px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1e1d; --panel: #262624; --line: #3a3936; --fg: #e9e7df; --muted: #b7b4aa; --faint: #7f7d75;
  --accent: #d77757; --accent-soft: #3c2b24; --accent-ink: #eb9575;
  --ok: #7fc37a; --ok-soft: #24342a; --warn: #e3b25f; --warn-soft: #3a3020; --bad: #f08c82; --bad-soft: #402623; --info: #7fb0e6; --info-soft: #22303f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1e1d; --panel: #262624; --line: #3a3936; --fg: #e9e7df; --muted: #b7b4aa; --faint: #7f7d75;
  --accent: #d77757; --accent-soft: #3c2b24; --accent-ink: #eb9575;
  --ok: #7fc37a; --ok-soft: #24342a; --warn: #e3b25f; --warn-soft: #3a3020; --bad: #f08c82; --bad-soft: #402623; --info: #7fb0e6; --info-soft: #22303f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--t-md)/1.55 var(--sans); }
#stream, .cmd, dialog pre, .nm { font-family: var(--mono); }
.app { display: grid; grid-template-columns: 172px minmax(0, 1fr); min-height: 100%; }
@media (min-width: 1100px) { .app { height: 100%; } }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: var(--s4) var(--s2); display: flex; flex-direction: column; gap: 4px; align-content: start; }
.side .lbl-unused { font-size: var(--t-xs); color: var(--faint); padding: 0 var(--s2) var(--s2); }
.side button { text-align: left; font-size: var(--t-sm); color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--r-sm); padding: 7px var(--s2); }
.side button:hover { color: var(--fg); background: var(--bg); }
.side button[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: var(--s2); } .side .grp { display: none; } .side button { white-space: nowrap; } }
.view[hidden] { display: none !important; }
.kv > span { min-width: 0; overflow-wrap: anywhere; } .kv > span:only-child { grid-column: 1 / -1; } .kv > span:nth-child(2) { text-align: right; }
.flow .ph { flex-wrap: wrap; } .flow .ph h2 { white-space: nowrap; } .flow .ph .hint { white-space: normal; }
.flow > .panel, .flow > details { flex: none; min-height: auto; overflow: visible; }
#v-monitor { display: grid; gap: var(--s3); grid-template-rows: auto auto 1fr; min-height: 0; }
.flow { display: grid; gap: var(--s3); align-content: start; min-height: 0; overflow: auto; }
.grid2 { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kv { display: grid; grid-template-columns: fit-content(45%) minmax(0, 1fr); gap: var(--s2); align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.kv .sub { grid-column: 1 / -1; color: var(--muted); font-size: var(--t-xs); }
.note { color: var(--muted); font-size: var(--t-xs); margin: 0; }
.cmd { font-size: var(--t-xs); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; overflow-x: auto; white-space: pre; }
.side .grp { font-size: var(--t-xs); letter-spacing: .04em; color: var(--faint); padding: var(--s3) var(--s2) 2px; text-transform: uppercase; }
.side button { display: flex; align-items: center; gap: var(--s2); }
.side button .ic { width: 18px; text-align: center; color: var(--accent); font-size: 14px; }
.note, .kv .sub, .node p, .lane p { font-family: var(--serif); }
.kv .sub { font-size: var(--t-sm); line-height: 1.6; white-space: normal; overflow: visible; }
.note { font-size: var(--t-sm); line-height: 1.6; }
.flowrow { display: flex; align-items: stretch; gap: var(--s2); flex-wrap: wrap; }
.node { flex: 1 1 170px; min-width: 150px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); padding: var(--s3); display: grid; gap: 6px; align-content: start; }
.node h3 { margin: 0; font-size: var(--t-md); font-weight: 600; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.node p { margin: 0; font-size: var(--t-sm); line-height: 1.55; color: var(--muted); }
.node.n-you { border-style: dashed; background: var(--bg); }
.node.n-main { border-color: var(--accent); background: var(--accent-soft); }
.node.n-done { border-color: var(--ok); background: var(--ok-soft); }
.node.n-side { background: var(--bg); }
.node .tools { font-family: var(--mono); font-size: var(--t-xs); color: var(--faint); overflow-wrap: anywhere; }
.flowrow.v { flex-direction: column; align-items: center; flex-wrap: nowrap; gap: 4px; }
.flowrow.v > .node, .flowrow.v > .par { width: min(800px, 100%); flex: 0 0 auto; }
.flowrow.v > .par { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-top: var(--s3); }
.flowrow.v .arrow::before { content: "\2193"; }
.arrow { align-self: center; color: var(--accent); font-size: 22px; line-height: 1; flex: 0 0 auto; }
.arrow::before { content: "\2192"; }
.par { flex: 1 1 200px; display: grid; gap: var(--s2); border: 1px dashed var(--accent); border-radius: var(--r-lg); padding: var(--s2); position: relative; }
.par::before { content: "병렬"; position: absolute; top: -9px; left: 10px; background: var(--bg); color: var(--accent-ink); font-size: var(--t-xs); padding: 0 6px; }
@media (max-width: 760px) { .flowrow { flex-direction: column; } .arrow::before { content: "\2193"; } .arrow { align-self: center; } }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.lanes { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.lane { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); padding: var(--s3); display: grid; gap: var(--s2); align-content: start; }
.lane h3 { margin: 0; font-size: var(--t-md); display: flex; align-items: center; justify-content: space-between; }
.lane .tag { font-size: var(--t-xs); color: var(--faint); }
.lane p { margin: 0; font-size: var(--t-xs); color: var(--muted); line-height: 1.5; }
.lane.opus { border-top: 3px solid var(--accent); } .lane.sonnet { border-top: 3px solid var(--info); } .lane.haiku { border-top: 3px solid var(--ok); } .lane.other { border-top: 3px solid var(--faint); }
.chip { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; background: var(--bg); font-size: var(--t-sm); }
.chip b { font-weight: 600; } .chip span { color: var(--faint); font-size: var(--t-xs); }
details.fold { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); padding: var(--s2) var(--s3); }
details.fold summary { cursor: pointer; font-weight: 600; font-size: var(--t-md); padding: 4px 0; }
details.fold[open] summary { margin-bottom: var(--s2); }
.tiles { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); padding: var(--s3) var(--s4); display: grid; gap: 2px; }
.tile .n { font-size: 28px; font-weight: 600; line-height: 1.1; }
.tile .l { font-size: var(--t-xs); color: var(--muted); }
.tile.bad .n { color: var(--bad); } .tile.warn .n { color: var(--warn); } .tile.ok .n { color: var(--ok); } .tile.acc .n { color: var(--accent-ink); }
.cards { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); padding: var(--s3); display: grid; gap: 4px; align-content: start; }
.card b { font-size: var(--t-sm); } .card p { margin: 0; font-family: var(--serif); font-size: var(--t-sm); color: var(--muted); line-height: 1.55; }
.svgi { flex: none; vertical-align: -3px; }
.card .ch { display: flex; align-items: center; gap: 8px; color: var(--accent); }
.card .ch b { color: var(--fg); }
.card { transition: border-color .15s, box-shadow .15s; } .card:hover { border-color: var(--accent); box-shadow: 0 1px 6px rgba(0,0,0,.06); }
.ck .i-ok, .ck .i-bad, .ck .i-warn { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; }
.ck .i-ok { background: rgba(120,140,93,.18); } .ck .i-bad { background: rgba(190,70,60,.15); } .ck .i-warn { background: rgba(217,160,60,.18); }
.erow .ico, .side button .ic { display: inline-flex; align-items: center; justify-content: center; }
.dia .fl { font-style: italic; }
.dia { overflow-x: auto; }
.dia svg { display: block; width: 100%; height: auto; min-width: 760px; }
.dia text { font-family: var(--sans); font-size: 12px; fill: var(--fg); }
.dia .sub { fill: var(--faint); font-size: 10.5px; }
.dia .life { stroke: var(--line); stroke-dasharray: 4 4; }
.dia .call { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.dia .ret { stroke: var(--faint); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
.dia .box { fill: var(--panel); stroke: var(--line); }
.dia .box.m { fill: var(--accent-soft); stroke: var(--accent); }
.dia .box.a { fill: var(--info-soft); stroke: var(--info); }
.dia .frag { fill: none; stroke: var(--accent); stroke-dasharray: 3 3; }
.dia .fl { fill: var(--accent-ink); font-size: 10.5px; }
.dia .tier { fill: var(--bg); stroke: var(--line); }
.dia .t-opus { stroke: var(--accent); } .dia .t-sonnet { stroke: var(--info); } .dia .t-haiku { stroke: var(--ok); }
.dia .edge { stroke: var(--faint); stroke-width: 1.2; fill: none; }
.dia .edge.inh { stroke-dasharray: 5 4; stroke: var(--accent); }
.fchips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.fchips .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.erow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: var(--s2); align-items: center; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; font-size: var(--t-sm); color: var(--fg); }
.erow:hover { background: var(--bg); }
.erow .ico { font-size: 16px; text-align: center; }
.exp { padding: var(--s2) var(--s3) var(--s3) 38px; background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: var(--t-sm); }
.exp p { margin: 0; font-family: var(--serif); line-height: 1.6; }
.donut { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; }
.donut svg { width: 120px; height: 120px; flex: 0 0 auto; }
.donut text { font-family: var(--sans); fill: var(--fg); }
.legend2 { display: grid; gap: 6px; font-size: var(--t-sm); }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.ring { width: 110px; height: 110px; }
.ring text { font-family: var(--sans); fill: var(--fg); }
.ck { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: var(--s2); padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; font-size: var(--t-sm); }
.ck .ev { grid-column: 2 / -1; color: var(--muted); font-family: var(--serif); font-size: var(--t-xs); }
.ck .i-ok { color: var(--ok); } .ck .i-bad { color: var(--bad); } .ck .i-warn { color: var(--warn); }
.shell { min-height: 100%; padding: var(--s4); display: grid; gap: var(--s3); grid-template-rows: auto 1fr; align-content: start; }
@media (min-width: 1100px) { .shell { height: 100%; } }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* badges: the one state vocabulary used everywhere */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: var(--r-sm); font-size: var(--t-xs); font-weight: 600; letter-spacing: .02em; white-space: nowrap; background: var(--line); color: var(--muted); transition: background-color .3s var(--ease), color .3s var(--ease); }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.live .pip { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.mark { color: var(--accent); font-size: var(--t-lg); font-weight: 700; }
.brand h1 { margin: 0; font-size: var(--t-lg); font-weight: 600; }
.brand .crumb { color: var(--faint); font-size: var(--t-sm); }
.meta { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.btn { font-size: var(--t-xs); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 10px; transition: border-color .2s; }
.btn:hover { border-color: var(--faint); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4); min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--s3); overflow: hidden; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.ph h2 { margin: 0; font-size: var(--t-md); font-weight: 600; }
.ph h2::before { content: "› "; color: var(--accent); }
.ph .hint { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: var(--s3) var(--s4); gap: 4px; }
.kpi .k { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); font-size: var(--t-xs); color: var(--muted); }
.kpi .v { font-size: clamp(18px, 2.6vw, var(--t-kpi)); font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v small { font-size: var(--t-sm); font-weight: 400; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.kpi .n { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: var(--s2); padding: var(--s3); }
@media (max-width: 1100px) { .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { display: flex; flex-direction: column; gap: 3px; padding: var(--s2) var(--s3); border: 1px solid transparent; border-radius: var(--r-sm); min-width: 0; transition: background-color .3s var(--ease), border-color .3s var(--ease); }
.step .nm { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: var(--t-sm); font-weight: 600; }
.step .vl { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .wh { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.active { background: var(--accent-soft); border-color: var(--accent); }

/* main grid */
.main { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 4fr); min-height: 0; }
.col { display: flex; flex-direction: column; gap: var(--s3); min-height: 0; min-width: 0; }
.col > .panel { flex: 1 1 0; }

/* charts */
.chart { position: relative; flex: 1; min-height: 120px; max-height: 300px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { fill: var(--faint); font: 10px var(--mono); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .grid g, .chart .bar, .chart .val { transition: transform .6s var(--ease), y .6s var(--ease), height .6s var(--ease), opacity .3s; }
.chart .bar { fill: var(--accent); opacity: .4; }
.chart .bar.last { opacity: 1; }
.chart .bar.hot { opacity: .85; }
.chart .val { font-weight: 600; fill: var(--accent-ink); }
.chart .cursor { stroke: var(--faint); stroke-dasharray: 2 3; opacity: 0; transition: opacity .15s; }
.chart.hover .cursor { opacity: 1; }
#tip { position: fixed; z-index: 10; pointer-events: none; padding: 4px 8px; border-radius: var(--r-sm); background: var(--fg); color: var(--bg); font-size: var(--t-xs); opacity: 0; transition: opacity .12s; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--t-xs); color: var(--muted); }
.legend b { font-weight: 600; color: var(--fg); margin-left: 4px; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; background: var(--accent); transition: width .6s var(--ease); }

/* rows (events, PRs, checks) */
.rows { display: flex; flex-direction: column; min-height: 0; }
.row { display: grid; align-items: center; gap: var(--s2); padding: 7px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row.new { animation: enter .7s var(--ease); }
@keyframes enter { from { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } to { background: transparent; transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .row.new { animation: none; } .chart .grid g, .chart .bar, .chart .val, .stack i { transition: none; } }
.ev { grid-template-columns: 56px 116px minmax(0, 1fr); }
.ev time { font-size: var(--t-xs); color: var(--faint); }
.ev .badge { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pr { grid-template-columns: 36px 68px minmax(0, 1fr) auto; }
.pr .badge { justify-self: start; }
.pr .d { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }
.add { color: var(--ok); } .del { color: var(--bad); }
.chk { grid-template-columns: 64px minmax(0, 1fr); }
.aw { grid-template-columns: 76px minmax(0, 1fr) auto; }
.aw .badge { justify-self: start; }
.aw .t b { font-weight: 600; margin-right: 6px; }
.aw .chips { display: inline-flex; gap: 4px; }
.aw.gone .t { color: var(--faint); }
.chk .badge { justify-self: start; }
.empty { color: var(--faint); font-size: var(--t-sm); padding: var(--s2) 0; }
@media (min-width: 1100px) and (max-height: 900px) { #perDay { display: none; } }

dialog { width: min(860px, calc(100vw - 32px)); max-height: 80vh; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); color: var(--fg); padding: var(--s4); font-family: var(--mono); }
button.proj { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; }
.adv { padding: var(--s2) var(--s3) var(--s3); background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: var(--s3); font-size: var(--t-sm); }
.adv .it { display: grid; gap: 2px; }
.adv a { color: var(--info); font-size: var(--t-xs); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s3); }
dialog h2 { margin: 0; font-size: var(--t-lg); }
dialog pre { margin: 0; font: 400 var(--t-xs)/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 56vh; overflow: auto; }
dialog pre .l-FAIL { color: var(--bad); font-weight: 700; } dialog pre .l-WARN { color: var(--warn); } dialog pre .l-PASS { color: var(--muted); }
.proj { grid-template-columns: minmax(90px, 1.2fr) repeat(5, minmax(0, 1fr)); }
.proj .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj.head { color: var(--faint); font-size: var(--t-xs); }
@media (max-width: 640px) { .proj { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .proj.head { display: none; } }
.tabs { display: flex; gap: var(--s2); margin-bottom: var(--s3); }
.tabs .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
/* stacked layout: must come after the panel rules above so it wins the cascade */
@media (max-width: 1099px) {
  .shell { grid-template-rows: none; grid-auto-rows: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .main, .col, .col > .panel { min-height: auto; }
  .col > .panel { flex: 0 0 auto; }
  .chart { flex: none; height: 170px; }
  #perDay { height: 100px !important; flex: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <button type="button" data-tab="dbg"><span class="ic">⚠</span>에러·디버깅</button>
  <div class="grp">구조</div>
  <button type="button" data-tab="orch"><span class="ic">⇢</span>오케스트레이션</button>
  <button type="button" data-tab="route"><span class="ic">⑂</span>모델 라우팅</button>

    </div>
  </header>

  <section class="view" id="v-monitor">
  <div class="kpis" id="kpis"></div>
  <div class="panel pipe" id="pipe"></div>

  <div class="main">
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>활동</h2><span class="hint" id="sessionNote"></span></div>
        <div class="legend" id="mixLegend"></div>
        <div class="stack" id="mixBar"></div>
        <div class="chart" id="perMin"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>실시간 이벤트</h2><span class="hint">최근 8건</span></div>
        <div class="rows" id="stream"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>AO 워커</h2><span class="hint" id="aoNote"></span></div>
        <div class="rows" id="aoRows"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>도구 점검</h2><span class="hint" id="toolNote"></span></div>
        <div class="rows" id="toolRows"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>변경 이력</h2><span class="hint" id="prNote"></span></div>
        <div class="rows" id="prs"></div>
        <div class="chart" id="perDay" style="min-height:110px;flex:0 0 110px"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>점검과 알림</h2><span class="hint" id="chkNote"></span></div>

  </section>
  <section class="view flow" id="v-orch" hidden></section>
  <section class="view flow" id="v-route" hidden></section>
  <section class="view flow" id="v-feat" hidden></section>
  <section class="view flow" id="v-prac" hidden></section>
  <section class="view flow" id="v-dbg" hidden></section>
  <section class="view flow" id="v-setup" hidden></section>
</div>
</div>
<div id="tip" role="tooltip"></div>

<dialog id="pdlg">
  <div class="dh"><h2>프로젝트 셋업</h2><button class="btn" id="pdlgClose" type="button">닫기</button></div>

</dialog>

<dialog id="dlg">
  <div class="dh"><h2>전체 로그</h2><button class="btn" id="dlgClose" type="button">닫기</button></div>
  <div class="tabs"><button class="btn" id="tabV" type="button" aria-pressed="true">verify --live</button><button class="btn" id="tabR" type="button" aria-pressed="false">루틴 보고서</button><button class="btn" id="tabA" type="button" aria-pressed="false">AO 세션</button></div>
  <pre id="dlgPre" tabindex="0"></pre>
</dialog>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const badge = (tone, text, pip) => { const b = el("span", "badge " + tone); if (pip) b.append(el("span", "pip")); b.append(document.createTextNode(text)); return b; };
  const NS = "http://www.w3.org/2000/svg";
  const sv = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  let lastOk = 0, last = null, tab = "v";
  const seen = new Set(); let firstEvents = true;

  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  };
  const dlg = $("dlg");
  $("logsBtn").onclick = () => { fillDlg(); dlg.showModal(); };
  $("dlgClose").onclick = () => dlg.close();
  const pdlg = $("pdlg");
  $("projBtn").onclick = () => { fillProj(); pdlg.showModal(); }; $("pdlgClose").onclick = () => pdlg.close();
  const bd = (tone, txt) => el("span", "badge " + tone, txt);
  const open = new Set(), SRC = { memory: "https://code.claude.com/docs/en/memory", "best-practices": "https://code.claude.com/docs/en/best-practices", permissions: "https://code.claude.com/docs/en/permissions", mcp: "https://code.claude.com/docs/en/mcp", skills: "https://code.claude.com/docs/en/skills", hooks: "https://code.claude.com/docs/en/hooks-guide", "claude-global": "https://github.com/DevCrop/claude-global/blob/main/CLAUDE.md" };
  const ACT = { add: ["info", "추가"], fix: ["warn", "수정"], remove: ["bad", "제거"] };
  function fillProj(rowsEl, hintEl) {
    rowsEl = rowsEl || $("projRows"); hintEl = hintEl || $("projHint");
    const list = (last && last.projects) || [];
    hintEl.textContent = list.length ? "읽기 전용: 파일 유무·줄 수·설정 키·스크립트 이름만 읽고 파일 내용은 보내지 않습니다. 행을 누르면 무엇을 추가·수정·제거할지 나옵니다." : "추적할 프로젝트가 없습니다. state/projects.txt에 경로를 한 줄씩 적거나 PROJECT_DIRS를 지정하세요.";
    const head = el("div", "row proj head"); ["프로젝트", "지침", "Claude 연결", "settings", "규칙", "개선"].forEach((t) => head.append(el("span", null, t)));
    const nodes = [];
    list.forEach((p) => {
      const cs = p.checks || [], bad = cs.filter((c) => c.level === "bad").length;
      const r = el("button", "row proj"); r.type = "button"; r.setAttribute("aria-expanded", open.has(p.name)); r.append(el("span", "nm", p.name));
      if (!p.found || p.error) { r.append(bd("bad", p.error ? "읽기 실패" : "경로 없음")); nodes.push(r); return; }
      r.append(p.agents ? bd("ok", "AGENTS " + p.agentsLines) : bd("info", "AGENTS 없음"));
      r.append(!p.claude ? bd(p.agents ? "ok" : "warn", p.agents ? "AGENTS 직접" : "지침 없음") : p.imports ? bd("ok", "@AGENTS") : p.agents ? bd("bad", "import 없음") : bd(p.claudeLines > 200 ? "warn" : "ok", "CLAUDE " + p.claudeLines));
      r.append(!p.settings ? bd("warn", "없음") : p.defaultMode ? bd("bad", "bypass 모드") : p.denyEnv ? bd("ok", ".env deny") : bd("warn", "deny 없음"));
      r.append(bd(p.rules ? "info" : "", p.rules + "개"));
      r.append(cs.length ? bd(bad ? "bad" : "warn", cs.length + "건") : bd("ok", "충족"));
      r.onclick = () => { open.has(p.name) ? open.delete(p.name) : open.add(p.name); fillProj(rowsEl, hintEl); };
      nodes.push(r);
      if (!open.has(p.name)) return;
      const box = el("div", "adv");
      cs.length || box.append(el("div", "empty", "확인한 모든 항목이 모범 사례를 따릅니다."));
      cs.forEach((c) => {
        const it = el("div", "it"), t = el("div", null); t.append(bd(ACT[c.act][0], ACT[c.act][1]), el("b", null, " " + c.what));
        const a = el("a", null, "근거: " + c.src + " 문서"); a.href = SRC[c.src]; a.target = "_blank"; a.rel = "noreferrer";
        it.append(t, el("div", "muted", "왜: " + c.why), el("div", null, "조치: " + c.fix), a); box.append(it);
      });
      nodes.push(box);
    });
    rowsEl.replaceChildren(...(list.length ? [head, ...nodes] : []));
  }
  $("tabV").onclick = () => { tab = "v"; fillDlg(); }; $("tabR").onclick = () => { tab = "r"; fillDlg(); }; $("tabA").onclick = () => { tab = "a"; fillDlg(); };
  function fillDlg() {
    $("tabV").setAttribute("aria-pressed", tab === "v"); $("tabR").setAttribute("aria-pressed", tab === "r"); $("tabA").setAttribute("aria-pressed", tab === "a");
    const pre = $("dlgPre"); if (!last) { pre.textContent = "데이터를 기다리는 중"; return; }
    if (tab === "v") pre.replaceChildren(...last.verify.lines.flatMap((l) => [el("span", "l-" + l.split(" ")[0], l), document.createTextNode("\n")]));
    else if (tab === "a") pre.textContent = aoText(last);
    else pre.textContent = (last.reports[0] || {}).text || "보고서가 아직 없습니다.";
  }

  const ago = (iso, now) => { const s = Math.max(0, Math.round((now - new Date(iso).getTime()) / 1000));
    return s < 60 ? s + "초 전" : s < 3600 ? Math.floor(s / 60) + "분 전" : s < 86400 ? Math.floor(s / 3600) + "시간 전" : Math.floor(s / 86400) + "일 전"; };
  const hms = (iso) => { const d = new Date(iso), p = (n) => String(n).padStart(2, "0"); return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()); };

  /* Bar chart built once, then updated in place so bars, gridlines and the end label animate to new values.
     One scale (top) places marks, gridlines and tick labels; the viewBox leaves room for the outermost labels. */
  const charts = {}, tip = $("tip");
  function chart(id, n, aria, ticks) {
    if (charts[id]) return charts[id];
    // viewBox = the host's real pixel size, so the chart fills the width at any panel size (rebuilt on resize)
    const host = $(id), W = Math.max(240, Math.round(host.clientWidth)), H = Math.max(70, Math.round(host.clientHeight)), L = 28, R = 8, T = 18, B = 20, bw = (W - L - R) / n;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid meet", role: "img", "aria-label": aria });
    const grid = sv("g", { class: "grid" }), gs = [0, 1, 2].map(() => { const g = sv("g"); g.append(sv("line", { x1: L, x2: W - R, y1: 0, y2: 0 }), sv("text", { x: L - 6, y: 3.5, "text-anchor": "end" })); grid.append(g); return g; });
    svg.append(grid);
    const cursor = sv("line", { class: "cursor", y1: T, y2: H - B }); svg.append(cursor);
    const rects = Array.from({ length: n }, (_, i) => { const r = sv("rect", { class: "bar", x: L + i * bw + 1.5, width: Math.max(1, bw - 3), rx: 2 }); svg.append(r); return r; });
    const val = sv("text", { class: "val", "text-anchor": "middle", x: L + (n - 0.5) * bw }); svg.append(val);
    ticks.forEach(([i, a, txt]) => { const tx = sv("text", { x: a === "start" ? L + i * bw : a === "end" ? L + (i + 1) * bw : L + (i + 0.5) * bw, y: H - 4, "text-anchor": a }); tx.textContent = txt; svg.append(tx); });
    host.replaceChildren(svg);
    const c = { vals: [], labels: [], unit: "" };
    host.addEventListener("pointermove", (e) => {
      const b = svg.getBoundingClientRect(), x = ((e.clientX - b.left) / b.width) * W, i = Math.floor((x - L) / bw);
      rects.forEach((r) => r.classList.remove("hot"));
      if (i < 0 || i >= n || !c.vals.length) { host.classList.remove("hover"); tip.style.opacity = 0; return; }
      rects[i].classList.add("hot"); host.classList.add("hover"); cursor.setAttribute("x1", L + (i + 0.5) * bw); cursor.setAttribute("x2", L + (i + 0.5) * bw);
      tip.textContent = c.labels[i] + " · " + c.vals[i] + c.unit; tip.style.opacity = 1; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY - 30 + "px";
    });
    host.addEventListener("pointerleave", () => { host.classList.remove("hover"); tip.style.opacity = 0; rects.forEach((r) => r.classList.remove("hot")); });
    c.update = (vals, labels, unit) => {
      const top = Math.max(2, Math.ceil(Math.max(1, ...vals) / 2) * 2), y = (v) => T + (H - T - B) * (1 - v / top);
      [0, top / 2, top].forEach((t, k) => { gs[k].style.transform = `translateY(${y(t)}px)`; gs[k].lastChild.textContent = Math.round(t * 10) / 10; });
      rects.forEach((r, i) => { r.style.y = y(vals[i]) + "px"; r.style.height = Math.max(vals[i] ? 2 : 0, H - B - y(vals[i])) + "px"; r.classList.toggle("last", i === n - 1); });
      val.textContent = vals[n - 1] || ""; val.style.y = y(vals[n - 1]) - 5 + "px"; val.setAttribute("y", y(vals[n - 1]) - 5);
      c.vals = vals; c.labels = labels; c.unit = unit || "";
    };
    return (charts[id] = c);
  }

  function kpi(tone, label, state, value, unit, note) {
    const c = el("div", "panel kpi");
    const k = el("div", "k"); k.append(el("span", null, label), badge(tone, state));
    const v = el("div", "v", value); if (unit) v.append(el("small", null, unit));
    c.append(k, v, el("div", "n", note)); return c;
  }

  const WRITE = new Set(["Edit", "Write", "NotebookEdit"]), READ = new Set(["Read", "Grep", "Glob", "ToolSearch", "WebFetch", "WebSearch"]);
  const toolTone = (e) => e.kind === "user" ? "ok" : WRITE.has(e.name) ? "accent" : e.name === "Bash" ? "warn" : READ.has(e.name) ? "" : "info";
  function activeNode(events, now) {
    for (const e of events.filter((e) => now - new Date(e.at).getTime() < 90000).slice(-6).reverse()) {
      const t = (e.target || "").toLowerCase();
      if (/verify\.sh|qa-deny/.test(t)) return "verify"; if (/apply\.sh/.test(t)) return "apply";
      if (/gh pr merge|git merge/.test(t)) return "merge"; if (/gh pr|git push/.test(t)) return "pr";
      if (WRITE.has(e.name) || /git (add|commit|checkout|switch)/.test(t)) return "edit";
    }
    return null;
  }

  const AOACT = { active: ["info", "ACTIVE"], idle: ["ok", "IDLE"], blocked: ["bad", "BLOCKED"], exited: ["", "EXITED"] };
  const VERD = { approved: ["ok", "APPROVED"], changes_requested: ["bad", "CHANGES"] };
  function aoText(s) {
    const a = s.ao || {}; if (!a.available) return "ao CLI를 찾지 못했습니다 (AO_BIN으로 경로를 지정할 수 있습니다).";
    const head = "daemon " + ((a.daemon || {}).state || "?") + " · port " + ((a.daemon || {}).port || "?") + " · uptime " + ((a.daemon || {}).uptime || "?") + " · projects " + (a.projects || []).join(", ") + "\n\n";
    return head + (a.sessions || []).map((x) => [x.id, x.role, x.status + "/" + x.activity, x.branch || "-",
      (x.prs || []).map((p) => "#" + p.number + " ci=" + p.ci + " review=" + (p.verdict || p.review)).join(" ") || "-", x.lastActivityAt || ""].join(" | ")).join("\n");
  }
  function render(s) {
    last = s; const now = new Date(s.now).getTime();
    const v = s.verify.counts, st = s.settings, g = s.git, prs = s.prs || [], ev = s.activity.events, rep = (s.reports || [])[0];
    const open = prs.filter((p) => p.state === "OPEN").length, merged = prs.filter((p) => p.state === "MERGED").length;
    const health = v.FAIL ? "bad" : v.WARN ? "warn" : "ok", healthTxt = v.FAIL ? "FAIL" : v.WARN ? "WARN" : "PASS";
    $("branch").textContent = g.branch || "—";
    $("mode").textContent = "mode " + (st.liveMode || "default"); $("mode").className = "badge " + (st.liveMode === "bypassPermissions" ? "warn" : "accent");

    const tools = ev.filter((e) => e.kind === "tool"), recent = tools.filter((e) => now - new Date(e.at).getTime() < 600000).length;
    const rulesOk = st.deny === st.liveDeny && st.ask === st.liveAsk;
    const ao = s.ao || { available: false }, aoS = ao.sessions || [], aoLive = aoS.filter((x) => !x.isTerminated), aoBlocked = aoLive.filter((x) => x.activity === "blocked"), aoDown = ao.available && (ao.daemon || {}).state !== "ready" && (ao.daemon || {}).state !== "loading";
    const aoPrs = aoS.flatMap((x) => x.prs || []), aoOk = aoPrs.filter((p) => p.verdict === "approved").length;
    const aoActive = aoLive.some((x) => x.activity === "active");
    const aoKpi = !ao.available ? kpi("", "AO", "N/A", "—", "", "ao CLI를 찾지 못함")
      : aoDown ? kpi("bad", "AO", "DOWN", "—", "", "데몬 " + ((ao.daemon || {}).state || "?"))
      : kpi(aoBlocked.length ? "bad" : aoActive ? "info" : aoLive.length ? "ok" : "", "AO", aoBlocked.length ? "BLOCKED" : aoActive ? "ACTIVE" : aoLive.length ? "IDLE" : "NO SESSION", String(aoLive.length), "실행 세션", "전체 " + aoS.length + " · PR 승인 " + aoOk + "/" + aoPrs.length);
    $("kpis").replaceChildren(
      kpi(health, "설정 상태", healthTxt, v.FAIL + " FAIL", v.WARN + " WARN", "PASS " + v.PASS + " · " + ago(s.verify.at, now)),
      kpi(rulesOk ? "ok" : "warn", "권한 규칙", rulesOk ? "SYNCED" : "DRIFT", st.liveDeny + " / " + st.liveAsk, "deny / ask", "repo " + st.deny + " / " + st.ask),
      kpi(open ? "warn" : "ok", "PR", open ? open + " OPEN" : "CLEAR", String(merged), "머지됨", "최근 " + prs.length + "개 기준"),
      kpi(recent ? "info" : "", "최근 10분", recent ? "ACTIVE" : "IDLE", String(recent), "도구 호출", s.activity.session ? "세션 " + s.activity.session : "세션 로그 없음"),
      aoKpi);

    const act = activeNode(ev, now), lastMerge = g.commits.find((c) => c.pr);
    const tuneOk = JSON.stringify(st.tune) === JSON.stringify(st.liveTune) && JSON.stringify(st.plugins) === JSON.stringify(st.livePlugins);
    const sync = st.mode === st.liveMode && rulesOk && tuneOk;
    const steps = [

      panel("디버깅 명령", "직접 실행", cmd("bash scripts/verify.sh --live      # 설정·적용 상태"), cmd("bash scripts/qa-hooks.sh             # secret-guard 단위 시험"), cmd("bash scripts/qa-deny.sh --static      # deny 규칙의 rtk 짝"), cmd("QA_MODE=selftest bash scripts/qa-role-agents.sh <dir>   # 채점기 자체 시험"), cmd("bash scripts/qa-dashboard.sh         # 이 대시보드 검사")));
  }
  function drawSetup(v) {
    const rows = el("div", "rows"), hint = el("span", "hint");
    v.replaceChildren(panel("프로젝트 셋업 점검", "", hint, rows));
    fillProj(rows, hint);
  }
  const DRAW = { orch: drawOrch, route: drawRoute, feat: drawFeat, prac: drawPrac, dbg: drawDbg, setup: drawSetup };
  async function loadInv() {
    try { const r = await fetch("/api/inventory", { cache: "no-store" }); inv = await r.json(); } catch (e) { return; }
    if (curTab !== "monitor" && curTab !== "setup") show(curTab);
  }
  function show(t) {
    if (!TABS.includes(t)) t = "monitor";
    curTab = t;
    TABS.forEach((k) => { $("v-" + k).hidden = k !== t; });
    document.querySelectorAll(".side button").forEach((b) => { b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"); });
    try { history.replaceState(null, "", "#" + t); } catch (e) {}
    if (t === "monitor") return;
    if (t === "setup") return DRAW.setup($("v-setup"));
    if (!inv) { wait($("v-" + t)); loadInv(); return; }
    DRAW[t]($("v-" + t));
  }
  document.querySelectorAll(".side button").forEach((b) => { b.onclick = () => show(b.dataset.tab); });
  setInterval(() => { if (curTab !== "monitor" && curTab !== "setup") loadInv(); }, 15000);
  show((location.hash || "").slice(1));
  addEventListener("hashchange", () => show((location.hash || "").slice(1)));

  async function tick() {
    try { const r = await fetch("/api/state", { cache: "no-store" }); render(await r.json()); lastOk = Date.now(); if (curTab === "setup") show(curTab); } catch (e) { /* keep the last frame */ }
    const fresh = Date.now() - lastOk < 8000;
    $("live").className = "badge live " + (fresh ? "ok" : "bad"); $("liveText").textContent = fresh ? "LIVE · 3s" : "OFFLINE";
  }
  tick(); setInterval(tick, 3000);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { for (const k in charts) delete charts[k]; if (last) render(last); }, 150); });
})();
</script>
</body>
</html>
