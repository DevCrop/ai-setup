<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-setup Workflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext x=%2716%27 y=%2725%27 font-size=%2726%27 text-anchor=%27middle%27 fill=%27%23d77757%27%3E%E2%9C%BB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div class="app">
<aside class="side" aria-label="화면 탭">
  <div class="grp">관찰</div>
  <button type="button" data-tab="monitor"><span class="ic">◉</span>모니터링</button>
  <button type="button" data-tab="dbg"><span class="ic">⚠</span>에러·디버깅</button>
  <div class="grp">구조</div>
  <button type="button" data-tab="orch"><span class="ic">⇢</span>오케스트레이션</button>
  <button type="button" data-tab="route"><span class="ic">⑂</span>모델 라우팅</button>
  <button type="button" data-tab="feat"><span class="ic">▤</span>기능 목록</button>
  <button type="button" data-tab="eff"><span class="ic">▥</span>도구 효율</button>
  <div class="grp">품질</div>
  <button type="button" data-tab="prac"><span class="ic">✓</span>권장기준 점검</button>
  <button type="button" data-tab="log"><span class="ic">≡</span>로그·조치</button>
  <button type="button" data-tab="setup"><span class="ic">⚙</span>프로젝트 셋업</button>
  <button type="button" data-tab="codex"><span class="ic">›</span>Codex 셋업</button>
</aside>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">✻</span>
      <div><h1>Setup workflow</h1><div class="crumb">ai-setup · <span id="branch">—</span></div></div>
    </div>
    <div class="meta">
      <span class="badge accent" id="mode">mode —</span>
      <span class="badge ok live" id="live"><span class="pip"></span><span id="liveText">연결 중</span></span>
      <button class="btn" id="projBtn" type="button">프로젝트 셋업</button>
      <button class="btn" id="logsBtn" type="button">전체 로그</button>
      <button class="btn" id="theme" type="button">테마</button>
    </div>
  </header>

  <section class="view" id="v-monitor">
  <div class="kpis" id="kpis"></div>
  <div class="panel pipe" id="pipe"></div>

  <div class="main">
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>활동</h2><span class="hint" id="sessionNote"></span></div>
        <div class="legend" id="mixLegend"></div>
        <div class="stack" id="mixBar"></div>
        <div class="chart" id="perMin"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>실시간 이벤트</h2><span class="hint">최근 8건</span></div>
        <div class="rows" id="stream"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>AO 워커</h2><span class="hint" id="aoNote"></span></div>
        <div class="rows" id="aoRows"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>도구 점검</h2><span class="hint" id="toolNote"></span></div>
        <div class="rows" id="toolRows"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>변경 이력</h2><span class="hint" id="prNote"></span></div>
        <div class="rows" id="prs"></div>
        <div class="chart" id="perDay" style="min-height:110px;flex:0 0 110px"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>점검과 알림</h2><span class="hint" id="chkNote"></span></div>
        <div class="rows" id="checks"></div>
      </div>
    </div>
  </div>
  </section>
  <section class="view page" id="v-orch" hidden></section>
  <section class="view page" id="v-route" hidden></section>
  <section class="view page" id="v-feat" hidden></section>
  <section class="view page" id="v-eff" hidden></section>
  <section class="view page" id="v-prac" hidden></section>
  <section class="view page" id="v-dbg" hidden></section>
  <section class="view page" id="v-log" hidden></section>
  <section class="view page" id="v-setup" hidden></section>
  <section class="view page" id="v-codex" hidden></section>
</div>
</div>
<div id="tip" role="tooltip"></div>

<dialog id="fixdlg">
  <div class="dh"><h2 id="fixTitle">조치 확인</h2><button class="btn" id="fixClose" type="button">닫기</button></div>
  <p class="muted" id="fixNote" style="font-size:var(--t-sm)"></p>
  <div class="rows" id="fixTargets"></div>
  <div class="fixbar"><button class="btn" id="fixGo" type="button">실행</button><span class="muted" id="fixRes"></span></div>
</dialog>

<dialog id="pdlg">
  <div class="dh"><h2>프로젝트 셋업</h2><button class="btn" id="pdlgClose" type="button">닫기</button></div>
  <div class="rows" id="projRows"></div>
  <p class="muted" id="projHint" style="font-size:var(--t-xs)"></p>
</dialog>

<dialog id="dlg">
  <div class="dh"><h2>전체 로그</h2><button class="btn" id="dlgClose" type="button">닫기</button></div>
  <div class="tabs"><button class="btn" id="tabV" type="button" aria-pressed="true">verify --live</button><button class="btn" id="tabA" type="button" aria-pressed="false">AO 세션</button></div>
  <div class="codebar"><div class="chips" id="dlgChips"></div><span class="muted" id="dlgMeta"></span><button class="btn" id="dlgCopy" type="button">복사</button></div>
  <div class="code" id="dlgPre" tabindex="0" role="log" aria-label="로그"></div>
</dialog>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
