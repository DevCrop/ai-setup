<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Monitor</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<header class="top">
<div class="topin">
<div class="brand"><span class="mark" aria-hidden="true">✻</span><h1>Claude Monitor</h1></div>
<nav class="tabs" id="tabs" aria-label="화면 탭">
<button type="button" data-tab="ov"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>개요</button>
<button type="button" data-tab="flow"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>구조</button>
<button type="button" data-tab="orch"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.2 8.3l3.6 7.4M16.8 8.3l-3.6 7.4M8.5 6h7"/></svg>오케스트레이션</button>
<button type="button" data-tab="route"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h13M14 4l3 3-3 3M20 17H7M10 14l-3 3 3 3"/></svg>모델 라우팅</button>
<button type="button" data-tab="tok"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 21h18M6 17v-6M11 17V5M16 17V9"/></svg>토큰</button>
<button type="button" data-tab="sav"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7l6 6 4-4 8 8M21 11v6h-6"/></svg>절감 효과</button>
<button type="button" data-tab="set"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>설정 상태</button>
<button type="button" data-tab="codex"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>Codex</button>
<button type="button" data-tab="rt"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>루틴</button>
<button type="button" data-tab="opt"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>최적화<span class="bdg" id="opt-badge" hidden><span id="opt-count"></span><span class="sr">건 확인 필요</span></span></button>
</nav>
<div class="tools"><span class="livep" id="livep" hidden><span class="dot" aria-hidden="true"></span><span id="livet"></span></span><span class="cap bad" id="copy-msg"></span><div class="seg" id="theme-seg" role="group" aria-label="화면 테마"><button type="button" data-theme="system" aria-pressed="false" disabled>시스템</button><button type="button" data-theme="light" aria-pressed="false" disabled>라이트</button><button type="button" data-theme="dark" aria-pressed="false" disabled>다크</button></div><button type="button" class="btn sm" id="copy-sum">요약 복사</button></div>
</div>
</header>
<main class="stage" id="stage">
<section class="view fill" id="v-frame" aria-label="모니터 화면">
<p class="msg" id="frame-msg" hidden></p>
<iframe id="frame" title="모니터 화면" sandbox="allow-scripts" hidden></iframe>
</section>
<section class="view" id="v-codex" aria-label="Codex" hidden></section>
<section class="view" id="v-rt" aria-label="루틴" hidden></section>
<section class="view" id="v-opt" aria-label="최적화" hidden></section>
</main>
<div class="sr" id="live" role="status"></div>
<script src="main.js"></script>
</body>
</html>
