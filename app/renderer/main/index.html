<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Monitor</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<header class="top">
<div class="topin">
<div class="brand"><span class="mark" aria-hidden="true">✻</span><h1>Claude Monitor</h1></div>
<nav class="tabs" id="tabs" aria-label="화면 탭">
<button type="button" data-tab="ov">개요</button>
<button type="button" data-tab="flow">구조</button>
<button type="button" data-tab="orch">오케스트레이션</button>
<button type="button" data-tab="route">모델 라우팅</button>
<button type="button" data-tab="tok">토큰</button>
<button type="button" data-tab="sav">절감 효과</button>
<button type="button" data-tab="set">설정 상태</button>
<button type="button" data-tab="codex">Codex</button>
<button type="button" data-tab="rt">루틴</button>
<button type="button" data-tab="opt">최적화<span class="bdg" id="opt-badge" hidden><span id="opt-count"></span><span class="sr">건 확인 필요</span></span></button>
</nav>
<div class="tools"><span class="cap bad" id="copy-msg"></span><div class="seg" id="theme-seg" role="group" aria-label="화면 테마"><button type="button" data-theme="system" aria-pressed="false">시스템</button><button type="button" data-theme="light" aria-pressed="false">라이트</button><button type="button" data-theme="dark" aria-pressed="false">다크</button></div><button type="button" class="btn sm" id="copy-sum">요약 복사</button></div>
</div>
</header>
<main class="stage" id="stage">
<section class="view fill" id="v-frame" aria-label="모니터 화면">
<p class="msg" id="frame-msg" hidden></p>
<iframe id="frame" title="모니터 화면" sandbox="allow-scripts" hidden></iframe>
</section>
<section class="view" id="v-codex" aria-label="Codex" hidden></section>
<section class="view" id="v-rt" aria-label="루틴" hidden></section>
<section class="view" id="v-opt" aria-label="최적화" hidden></section>
</main>
<div class="sr" id="live" role="status"></div>
<script src="main.js"></script>
</body>
</html>
